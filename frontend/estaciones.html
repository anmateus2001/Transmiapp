<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TransmiEye · Estaciones</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="cabecera">
    <div><h1>Estaciones</h1><p>Eventos de hoy por estación. Las estaciones con ingresos laterales llevan la franja roja.</p></div>
    <div class="acciones"><button class="btn primario" id="btn-nueva" data-rol="admin">Agregar estación</button></div>
  </div>
  <div class="estaciones" id="lista"></div>
</main>
<script src="js/common.js"></script>
<script>
if (TE.montar('estaciones.html')) {
  const $ = (id) => document.getElementById(id);
  let estaciones = [];
  async function cargar() {
    try {
      estaciones = await TE.get('/api/estaciones');
      estaciones.sort((a, b) => b.ingresos_hoy - a.ingresos_hoy || b.eventos_hoy - a.eventos_hoy || a.nombre.localeCompare(b.nombre));
      $('lista').innerHTML = estaciones.map(e => `
        <article class="estacion ${e.ingresos_hoy ? 'con-ingresos' : ''} ${e.activa ? '' : 'inactiva'}">
          <div class="nombre">${TE.esc(e.nombre)}</div>
          <div class="linea">${TE.esc(e.linea)}${e.localidad ? ' · ' + TE.esc(e.localidad) : ''}${e.activa ? '' : ' · fuera de operación'}</div>
          <div class="cifras">
            <div class="rojo"><b>${e.ingresos_hoy}</b>ingresos laterales</div>
            <div><b>${e.eventos_hoy}</b>eventos</div>
            <div><b>${e.camaras_en_linea}/${e.camaras}</b>cámaras</div>
          </div>
          <div class="acciones" style="margin-top:12px">
            <a class="btn chico" href="historial.html">Ver eventos</a>
            ${TE.puede('admin') ? `<button class="btn chico" data-id="${e.id}">Editar</button>` : ''}
            ${e.latitud ? `<a class="btn chico texto" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${e.latitud}&mlon=${e.longitud}#map=17/${e.latitud}/${e.longitud}">Mapa</a>` : ''}
          </div>
        </article>`).join('') || '<div class="bloque vacio"><strong>No hay estaciones</strong>Agrega la primera estación.</div>';
    } catch (e) { TE.error(e); }
  }
  function formulario(e) {
    const m = TE.modal(e ? `Editar ${e.nombre}` : 'Agregar estación', `
      <div class="campo"><label for="e-nombre">Nombre</label><input id="e-nombre" type="text" value="${TE.esc(e?.nombre || '')}"></div>
      <div class="fila-campos">
        <div class="campo"><label for="e-linea">Troncal o línea</label><input id="e-linea" type="text" value="${TE.esc(e?.linea || '')}" placeholder="Caracas (A)"></div>
        <div class="campo"><label for="e-loc">Localidad</label><input id="e-loc" type="text" value="${TE.esc(e?.localidad || '')}"></div>
      </div>
      <div class="fila-campos">
        <div class="campo"><label for="e-lat">Latitud</label><input id="e-lat" type="number" step="0.0001" value="${e?.latitud ?? ''}"></div>
        <div class="campo"><label for="e-lon">Longitud</label><input id="e-lon" type="number" step="0.0001" value="${e?.longitud ?? ''}"></div>
      </div>
      <label style="display:flex;gap:10px;align-items:center"><span class="interruptor"><input id="e-activa" type="checkbox" ${!e || e.activa ? 'checked' : ''}><span></span></span> Estación en operación</label>`, {
      pie: `${e ? '<button class="btn peligro" id="e-borrar" style="margin-right:auto">Eliminar</button>' : ''}<button class="btn primario" id="e-guardar">${e ? 'Guardar cambios' : 'Agregar estación'}</button>`,
    });
    m.$('#e-guardar').onclick = async () => {
      const num = (v) => v === '' ? null : +v;
      const d = { nombre: m.$('#e-nombre').value.trim(), linea: m.$('#e-linea').value.trim(), localidad: m.$('#e-loc').value.trim(),
                  latitud: num(m.$('#e-lat').value), longitud: num(m.$('#e-lon').value), activa: m.$('#e-activa').checked };
      if (!d.nombre || !d.linea) return TE.toast('El nombre y la troncal son obligatorios.', 'critica');
      try { e ? await TE.api('PUT', `/api/estaciones/${e.id}`, d) : await TE.api('POST', '/api/estaciones', d); m.cerrar(); TE.toast('Estación guardada.'); cargar(); }
      catch (err) { TE.error(err); }
    };
    m.$('#e-borrar')?.addEventListener('click', async () => {
      if (!confirm(`¿Eliminar la estación ${e.nombre}?`)) return;
      try { await TE.api('DELETE', `/api/estaciones/${e.id}`); m.cerrar(); TE.toast('Estación eliminada.'); cargar(); } catch (err) { TE.error(err); }
    });
  }
  $('btn-nueva').onclick = () => formulario(null);
  $('lista').addEventListener('click', (ev) => { const id = ev.target.dataset.id; if (id) formulario(estaciones.find(e => e.id === +id)); });
  cargar(); setInterval(cargar, 15000);
  document.addEventListener('te:evento', cargar);
}
</script>
</body>
</html>
